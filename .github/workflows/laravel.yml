name: Laravel CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      WWWUSER: 1000
      WWWGROUP: 1000

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker images
        run: docker compose build

      - name: Start containers
        run: docker compose up -d

      - name: Wait for MySQL to be healthy
        run: |
          echo "Waiting for MySQL..."
          for i in {1..30}; do
            status=$(docker inspect --format='{{.State.Health.Status}}' peminjaman-mysql-1 2>/dev/null || echo "starting")
            if [ "$status" == "healthy" ]; then
              echo "MySQL is healthy"
              break
            fi
            echo "Status: $status, waiting..."
            sleep 3
          done

      - name: Generate app key
        run: docker compose exec -T laravel.test php artisan key:generate

      - name: Run migrations
        run: docker compose exec -T laravel.test php artisan migrate --force

      - name: Run tests
        run: docker compose exec -T laravel.test php artisan test

      - name: Tag and push image
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag sail-8.2/app ghcr.io/mdinah/peminjaman:${{ github.sha }}
          docker tag sail-8.2/app ghcr.io/mdinah/peminjaman:latest
          docker push ghcr.io/mdinah/peminjaman:${{ github.sha }}
          docker push ghcr.io/mdinah/peminjaman:latest

      - name: Stop containers
        if: always()
        run: docker compose down